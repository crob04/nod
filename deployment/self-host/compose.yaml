name: nod-server

services:
  server:
    image: registry.gitlab.crmediaserver.com/crob04/coolify-runtime-images/nod-server@sha256:0658e64beb0303540c956747ae8405c96eb849236b82144ebdc863da3a0b2661
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NOD_ENVIRONMENT: production
      NOD_HOST: 0.0.0.0
      PORT: ${PORT:-4310}
      NOD_DATA_ROOT: /var/lib/nod
      NOD_PUBLIC_URL: ${NOD_PUBLIC_URL:?Set NOD_PUBLIC_URL in Coolify}
      NOD_ANALYTICS_ENABLED: ${NOD_ANALYTICS_ENABLED:-false}
      NOD_AUTH_TOKEN: ${NOD_AUTH_TOKEN:?Set NOD_AUTH_TOKEN in Coolify}
      NOD_VAULT_KEY: ${NOD_VAULT_KEY:?Set NOD_VAULT_KEY in Coolify}
      DATABASE_URL: postgresql://nod:${NOD_POSTGRES_PASSWORD:?Set NOD_POSTGRES_PASSWORD in Coolify}@postgres:5432/nod
      DOCKER_HOST: tcp://runtime:2375
      WORKSPACE_CONTAINER: nod-workspace-nod-server
      BROWSER_CONTAINER: nod-browser-nod-server
    expose: ['4310']
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify-proxy
      - traefik.http.routers.nod.rule=Host(`nod.crmediaserver.com`)
      - traefik.http.routers.nod.entrypoints=http
      - traefik.http.routers.nod.service=nod
      - traefik.http.services.nod.loadbalancer.server.port=4310
      - traefik.http.services.nod.loadbalancer.passhostheader=true
      - traefik.http.services.nod.loadbalancer.responseforwarding.flushinterval=-1
    volumes:
      - server-data:/var/lib/nod
      - workspace-data:/var/lib/nod/workspaces
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: ${NOD_SERVER_MEMORY:-2g}
    networks: [backend, control, outbound, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
      browser:
        condition: service_healthy
      workspace:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs']
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: nod
      POSTGRES_PASSWORD: ${NOD_POSTGRES_PASSWORD:?Set NOD_POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: nod
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nod -d nod']
      interval: 5s
      timeout: 3s
      retries: 30

  runtime:
    image: registry.gitlab.crmediaserver.com/crob04/coolify-runtime-images/nod-runtime@sha256:df225c3350081c00c8626a0d7a2e500b8dba9329db07a11b51f90eb8cd9eda66
    restart: unless-stopped
    init: true
    command: ['node', '/app/docker-proxy.mjs']
    environment:
      WORKSPACE_CONTAINER: nod-workspace-nod-server
      BROWSER_CONTAINER: nod-browser-nod-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:2375/containers/" + process.env.WORKSPACE_CONTAINER + "/json",
          {signal: AbortSignal.timeout(2000)}).then(async response => {
          if (!response.ok || !(await response.json()).State?.Running) process.exitCode = 1;
          }).catch(() => { process.exitCode = 1; })
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  browser:
    image: registry.gitlab.crmediaserver.com/crob04/coolify-runtime-images/nod-browser@sha256:f1aec8dca249c0f02f49f26ac4e1ecdf24ad383e6917d61626f9998d400aadd1
    container_name: nod-browser-nod-server
    hostname: nod-browser
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 1024
    mem_limit: ${NOD_BROWSER_MEMORY:-3g}
    shm_size: 512m
    volumes:
      - browser-data:/data
    tmpfs:
      - /tmp:size=512m
      - /home/node:uid=1000,gid=1000,mode=700,size=256m
    networks: [browser]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'const s=require("node:net").connect("/data/control.sock");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  workspace:
    image: registry.gitlab.crmediaserver.com/crob04/coolify-runtime-images/nod-workspace@sha256:aa71836010d2ff93d1057bae319f46bb5d301a1dc8ed3ad1a78bfb4b55f4e5da
    container_name: nod-workspace-nod-server
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: ${NOD_WORKSPACE_MEMORY:-2g}
    volumes:
      - workspace-data:/workspace
      - workspace-tools:/home/node
    network_mode: service:workspace-network
    depends_on:
      workspace-network:
        condition: service_healthy
        restart: true
    command: ['sleep', 'infinity']
    healthcheck:
      test: ['CMD-SHELL', 'test -w /workspace && test -w /home/node && test -x /usr/bin/python3']
      interval: 30s
      timeout: 3s
      retries: 3

  workspace-network:
    image: registry.gitlab.crmediaserver.com/crob04/coolify-runtime-images/nod-workspace@sha256:aa71836010d2ff93d1057bae319f46bb5d301a1dc8ed3ad1a78bfb4b55f4e5da
    dns: [1.1.1.1, 8.8.8.8]
    user: root
    restart: unless-stopped
    init: true
    entrypoint: /usr/local/bin/nod-workspace-network
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=1m
    pids_limit: 32
    mem_limit: 64m
    networks: [workspace]
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/network-ready']
      interval: 2s
      timeout: 3s
      retries: 10

networks:
  backend:
    internal: true
  control:
    internal: true
  outbound:
  browser:
  workspace:
  proxy:
    external: true
    name: coolify-proxy

volumes:
  server-data:
    name: nod-server_server-data
  postgres-data:
    name: nod-server_postgres-data
  workspace-data:
    name: nod-server_workspace-data
  workspace-tools:
    name: nod-server_workspace-tools
  browser-data:
    name: nod-server_browser-data
